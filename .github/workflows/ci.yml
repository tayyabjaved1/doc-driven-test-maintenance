name: CI
on:
  push:
  pull_request:
jobs:
  test-case-maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
  stalled-queue-digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stalled-queue-digest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stalled-queue-digest/package-lock.json
      - run: npm ci
      - run: npm test
